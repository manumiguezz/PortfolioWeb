  <script type="text/javascript">
    window.portfolioRenderPdfPages = async function(container, sourceUrl, zoom, maxPages, compact, animateTransition) {
      if (!container || !window.pdfjsLib || !sourceUrl) {
        return;
      }

      const renderToken = `${Date.now()}-${Math.random()}`;
      const pageLimit = Math.max(1, Math.min(maxPages || 2, 2));
      const zoomMultiplier = Math.max(0.65, Math.min(1.6, (zoom || 100) / 100));
      const pixelRatio = window.devicePixelRatio || 1;
      const containerPadding = compact ? 12 : 18;

      container.dataset.renderToken = renderToken;
      container.style.transition = animateTransition ? "opacity 360ms ease" : "none";
      if (animateTransition) {
        container.style.opacity = "0.16";
        await new Promise(resolve => setTimeout(resolve, 260));
        if (container.dataset.renderToken !== renderToken) return;
      }

      container.innerHTML = "";
      container.style.width = "100%";
      container.style.height = "100%";
      container.style.overflow = "auto";
      container.style.backgroundColor = "#ffffff";
      container.style.boxSizing = "border-box";
      container.style.padding = `${containerPadding}px`;
      container.style.display = "flex";
      container.style.flexDirection = "column";
      container.style.alignItems = compact && zoomMultiplier > 1 ? "flex-start" : "center";
      container.style.gap = compact ? "14px" : "18px";
      container.style.opacity = animateTransition ? "0.16" : "1";

      const loader = document.createElement("div");
      loader.textContent = "Loading CV...";
      loader.style.color = "#111111";
      loader.style.fontFamily = "Poppins, sans-serif";
      loader.style.fontWeight = "700";
      loader.style.padding = "32px";
      container.appendChild(loader);

      const isCurrentRender = () => container.dataset.renderToken === renderToken;

      try {
        const pdfDocument = await pdfjsLib.getDocument(sourceUrl).promise;
        if (!isCurrentRender()) return;

        container.removeChild(loader);

        const pagesToRender = Math.min(pdfDocument.numPages, pageLimit);
        for (let pageNumber = 1; pageNumber <= pagesToRender; pageNumber++) {
          const page = await pdfDocument.getPage(pageNumber);
          if (!isCurrentRender()) return;

          const baseViewport = page.getViewport({ scale: 1 });
          const availableWidth = Math.max(240, container.clientWidth - (containerPadding * 2));
          const fitScale = compact ? availableWidth / baseViewport.width : 1;
          const viewport = page.getViewport({ scale: fitScale * zoomMultiplier });
          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");

          canvas.width = Math.floor(viewport.width * pixelRatio);
          canvas.height = Math.floor(viewport.height * pixelRatio);
          canvas.style.width = `${viewport.width}px`;
          canvas.style.height = `${viewport.height}px`;
          canvas.style.maxWidth = "none";
          canvas.style.flex = "0 0 auto";
          canvas.style.backgroundColor = "#ffffff";
          canvas.style.boxShadow = "0 10px 22px rgba(0, 0, 0, 0.12)";

          context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, viewport.width, viewport.height);

          await page.render({ canvasContext: context, viewport }).promise;
          if (!isCurrentRender()) return;

          container.appendChild(canvas);
        }

        requestAnimationFrame(() => {
          if (isCurrentRender()) {
            container.style.opacity = "1";
          }
        });
      } catch (error) {
        if (!isCurrentRender()) return;

        container.innerHTML = "";
        const message = document.createElement("div");
        message.textContent = "Unable to load the CV.";
        message.style.color = "#111111";
        message.style.fontFamily = "Poppins, sans-serif";
        message.style.fontWeight = "700";
        message.style.padding = "32px";
        container.appendChild(message);
        container.style.opacity = "1";
      }
    };
  </script>

  <script>
    function delay(time) {
      return new Promise(resolve => setTimeout(resolve, time));
    }

    function nextFrame() {
      return new Promise(resolve => requestAnimationFrame(() => resolve()));
    }

    const loaderParticlesConfig = [
      {
        count: 90,
        color: 'rgba(34, 34, 34, 0.95)',
        minSize: 10,
        maxSize: 80,
        minSpeed: 0.01,
        maxSpeed: 0.4,
        blur: 90,
      },
      {
        count: 30,
        color: 'rgb(21, 21, 21)',
        minSize: 1,
        maxSize: 70,
        minSpeed: 0.01,
        maxSpeed: 1.5,
        blur: 70,
      },
      {
        count: 7,
        color: 'rgba(34, 34, 34, 0.82)',
        minSize: 1,
        maxSize: 70,
        minSpeed: 0.01,
        maxSpeed: 2,
        blur: 8,
      },
      {
        count: 10,
        color: 'rgb(50, 50, 50)',
        minSize: 1,
        maxSize: 30,
        minSpeed: 0.01,
        maxSpeed: 0.7,
        blur: 0,
      },
    ];

    function createLoaderParticleBackground() {
      const canvas = document.querySelector('.loader-particle-background');
      const context = canvas?.getContext('2d');

      if (!canvas || !context) {
        return null;
      }

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const particleMaxPixelRatio = 2;
      const particleFrameInterval = 1000 / 30;
      const particleSpriteSizeStep = 8;
      let particlePixelRatio = 1;
      let seed = 17431;
      let width = 0;
      let height = 0;
      let animationFrame = 0;
      let stopped = false;
      let lastFrame = performance.now();
      let lastDrawFrame = 0;
      let layers = [];

      function random() {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        return seed / 4294967296;
      }

      function randomBetween(min, max) {
        return min + (random() * (max - min));
      }

      function createCanvas(width, height) {
        if (typeof OffscreenCanvas !== 'undefined') {
          return new OffscreenCanvas(width, height);
        }

        const spriteCanvas = document.createElement('canvas');
        spriteCanvas.width = width;
        spriteCanvas.height = height;
        return spriteCanvas;
      }

      function getParticlePixelRatio() {
        return Math.min(
          Math.max(window.devicePixelRatio || 1, 1),
          particleMaxPixelRatio,
        );
      }

      function getColorWithAlpha(color, alpha) {
        const channels = String(color).match(/rgba?\(([^)]+)\)/i)?.[1]
          ?.split(',')
          .map(value => value.trim());

        if (!channels || channels.length < 3) {
          return `rgba(255, 255, 255, ${alpha})`;
        }

        return `rgba(${channels[0]}, ${channels[1]}, ${channels[2]}, ${alpha})`;
      }

      function detectCanvasBlurSupport() {
        try {
          const testCanvas = createCanvas(32, 32);
          const testContext = testCanvas.getContext('2d');

          if (!testContext || !('filter' in testContext)) {
            return false;
          }

          testContext.clearRect(0, 0, 32, 32);
          testContext.filter = 'blur(4px)';

          if (testContext.filter !== 'blur(4px)') {
            return false;
          }

          testContext.fillStyle = 'rgba(0, 0, 0, 1)';
          testContext.fillRect(15, 15, 2, 2);
          testContext.filter = 'none';

      const supportsParticleCanvasBlur = detectCanvasBlurSupport();

      function createParticleSprite(size, blur, color) {
        const renderScale = particlePixelRatio;
        const radius = Math.max(size / 1.2, 1);
        const padding = Math.ceil((blur || 0) * 2) + 2;
        const spriteSize = Math.max(Math.ceil((radius + padding) * 2), 4);
        const physicalSpriteSize = Math.max(Math.ceil(spriteSize * renderScale), 4);
        const physicalRadius = radius * renderScale;
        const physicalBlur = (blur || 0) * renderScale;
        const spriteCanvas = createCanvas(physicalSpriteSize, physicalSpriteSize);
        const spriteContext = spriteCanvas.getContext('2d');

        if (!spriteContext) {
          return null;
        }

        spriteContext.clearRect(0, 0, physicalSpriteSize, physicalSpriteSize);

        if (blur && !supportsParticleCanvasBlur) {
          const center = physicalSpriteSize / 2;
          const outerRadius = Math.min(center, physicalRadius + (physicalBlur * 1.35));
          const coreStop = Math.min(Math.max(physicalRadius / (outerRadius * 3.2), 0.04), 0.16);
          const glowStop = Math.min(coreStop + 0.38, 0.72);
          const gradient = spriteContext.createRadialGradient(
            center,
            center,
            Math.max(physicalRadius * 0.12, 1),
            center,
            center,
            outerRadius,
          );

          gradient.addColorStop(0, color);
          gradient.addColorStop(coreStop, color);
          gradient.addColorStop(glowStop, getColorWithAlpha(color, 0.18));
          gradient.addColorStop(1, getColorWithAlpha(color, 0));
          spriteContext.fillStyle = gradient;
          spriteContext.fillRect(0, 0, physicalSpriteSize, physicalSpriteSize);
        } else {
          spriteContext.filter = physicalBlur ? `blur(${physicalBlur}px)` : 'none';
          spriteContext.fillStyle = color;
          spriteContext.beginPath();
          spriteContext.arc(
            physicalSpriteSize / 2,
            physicalSpriteSize / 2,
            physicalRadius,
            0,
            Math.PI * 2,
          );
          spriteContext.fill();
          spriteContext.filter = 'none';
        }

        return {
          image: spriteCanvas,
          size: spriteSize,
          particleSize: size,
        };
      }

      function getParticleSprite(layer, size) {
        const sizeBucket = Math.max(
          particleSpriteSizeStep,
          Math.round(size / particleSpriteSizeStep) * particleSpriteSizeStep,
        );
        const spriteKey = `${sizeBucket}`;

        if (!layer.spriteCache.has(spriteKey)) {
          layer.spriteCache.set(
            spriteKey,
            createParticleSprite(sizeBucket, layer.blur, layer.color),

        return layer.spriteCache.get(spriteKey);

      function activateParticle(config) {

        const speed = randomBetween(config.minSpeed, config.maxSpeed);
        const direction = random() < 0.5 ? -1 : 1;
        const size = randomBetween(config.minSize, config.maxSize);

        return {
          x: randomBetween(0, width),
          y: randomBetween(0, height),
          size,
          baseSize: size,
          sprite: getParticleSprite(config, size),
          vx: Math.sin(angleSeed) * speed * direction,
          vy: Math.cos(angleSeed) * speed * direction,
          lifeLeft: randomBetween(200, 500),

              particle.y - (drawSize / 2),

        element.style.transition = 'none';
        element.style.opacity = `${opacity}`;
        element.getBoundingClientRect();
        element.style.transition = '';
      }

      async function lockFullWhiteCoverage() {
        if (!loaderContent || state.hasLoaderCompleted) {
          return;
        }

        loaderContent.classList.add('is-full-white-covered');
        if (fullWhiteCover) {
          fullWhiteCover.style.visibility = 'visible';
        }
        setLayerOpacityImmediately(fullWhiteCover, 1);
        window.portfolioLoaderParticleBackground?.stop();
        await nextFrame();
        state.hasFullWhiteCoverage = true;
        loaderContent.classList.add('is-white-covering');
        setLayerOpacityImmediately(liquidReveal, 1);
        await nextFrame();
      }

      async function prepareStripeRevealLayer() {
        if (!loaderContent || !state.hasFullWhiteCoverage || state.hasLoaderCompleted) {
          return;
        }

        loaderContent.classList.add('is-stripe-ready');
        window.portfolioLoaderParticleBackground?.stop();
        if (liquidReveal) {
          liquidReveal.style.display = '';
          liquidReveal.style.visibility = 'visible';
        }
        setLayerOpacityImmediately(liquidReveal, 1);
        await nextFrame();

        if (whiteBlob) {
          whiteBlob.getAnimations?.().forEach(animation => animation.cancel());
          whiteBlob.style.opacity = '0';
          whiteBlob.style.visibility = 'hidden';
        }

        setLayerOpacityImmediately(fullWhiteCover, 0);
        if (fullWhiteCover) {
          fullWhiteCover.style.visibility = 'hidden';
        }

        loaderContent.classList.remove('is-blob-expanding');
        state.hasStripeReady = true;
        await nextFrame();
      }

      function resetCompressionMotionBlur() {
        motionGhosts.forEach(ghost => {
          ghost.getAnimations?.().forEach(animation => animation.cancel());
          ghost.style.opacity = '0';
          ghost.style.filter = 'blur(0px)';
          ghost.style.transform = 'translate3d(0, 0, 0) rotate(0deg) scale(1)';
        });
      }

      function animateCompressionMotionBlur(duration, easing) {
        if (!motionGhosts.length || prefersReducedMotion.matches) {
          return [];
        }

        resetCompressionMotionBlur();

        const ghostSettings = [
          {
            rotations: [-2, -8, -19, -32],
            opacity: [0, 0.11, 0.26, 0.38, 0.42],
            blur: [0.2, 1.15, 2.55, 3.65],
          },
          {
            rotations: [2, 10, 25, 42],
            opacity: [0, 0.09, 0.22, 0.32, 0.36],
            blur: [0.25, 1.45, 3.1, 4.25],
          },
          {
            rotations: [-4, -15, -36, -56],
            opacity: [0, 0.055, 0.14, 0.23, 0.25],
            blur: [0.35, 1.9, 4, 5.4],
          },
        ];

        return motionGhosts.map((ghost, index) => {
          const settings = ghostSettings[index] || ghostSettings[ghostSettings.length - 1];

          return ghost.animate([
            {
              opacity: 0,
              filter: 'blur(0px)',
              transform: 'translate3d(0, 0, 0) rotate(0deg) scale(1)',
            },
            {
              opacity: settings.opacity[1],
              filter: `blur(${settings.blur[0]}px)`,
              transform: `translate3d(0, 0, 0) rotate(${settings.rotations[0]}deg) scale(1.004)`,
              offset: 0.18,
            },
            {
              opacity: settings.opacity[2],
              filter: `blur(${settings.blur[1]}px)`,
              transform: `translate3d(0, 0, 0) rotate(${settings.rotations[1]}deg) scale(1.014)`,
              offset: 0.42,
            },
            {
              opacity: settings.opacity[3],
              filter: `blur(${settings.blur[2]}px)`,
              transform: `translate3d(0, 0, 0) rotate(${settings.rotations[2]}deg) scale(1.024)`,
              offset: 0.74,
            },
            {
              opacity: settings.opacity[4],
              filter: `blur(${settings.blur[3]}px)`,
              transform: `translate3d(0, 0, 0) rotate(${settings.rotations[3]}deg) scale(1.034)`,
              offset: 0.88,
            },
            {
              opacity: 0,
              filter: `blur(${settings.blur[2]}px)`,
              transform: `translate3d(0, 0, 0) rotate(${settings.rotations[3]}deg) scale(1.034)`,
            },
          ], {
            duration,
            easing,
            fill: 'forwards',
          });
        });
      }

      async function accelerateAndCompressSymbol(handoffRotation) {
        if (!loaderContent || !yinYangSymbol || prefersReducedMotion.matches) {
          return;
        }

        const currentRotation = Number.isFinite(handoffRotation)
          ? handoffRotation
          : getCurrentRotationDegrees(yinYangSymbol);
        const targetRotation = currentRotation + 1980;
        const compressionDuration = 1560;
        const compressionEasing = 'linear';
        yinYangSymbol.style.transform = `rotate(${currentRotation}deg) scale(1)`;
        yinYangSymbol.style.animation = 'none';

        const simplifyDots = delay(840).then(() => {
          loaderContent.classList.add('is-simplifying');
        });
        const motionBlurAnimations = animateCompressionMotionBlur(
          compressionDuration,
          compressionEasing,
        );
        const animation = yinYangSymbol.animate([
          {
            filter: 'blur(0px) brightness(1)',
            transform: `rotate(${currentRotation}deg) scale(1)`,
          },
          {
            filter: 'blur(0.25px) brightness(1.02)',
            transform: `rotate(${currentRotation + 130}deg) scale(0.82)`,
            offset: 0.18,
          },
          {
            filter: 'blur(0.55px) brightness(1.04)',
            transform: `rotate(${currentRotation + 470}deg) scale(0.56)`,
            offset: 0.42,
          },
          {
            filter: 'blur(1.05px) brightness(1.06)',
            transform: `rotate(${currentRotation + 1020}deg) scale(0.32)`,
            offset: 0.68,
          },
          {
            filter: 'blur(1.45px) brightness(1.08)',
            transform: `rotate(${currentRotation + 1540}deg) scale(0.19)`,
            offset: 0.86,
          },
          {
            filter: 'blur(1.65px) brightness(1.08)',
            transform: `rotate(${targetRotation}deg) scale(0.14)`,
          },
        ], {
          duration: compressionDuration,
          easing: compressionEasing,
          fill: 'forwards',
        });

        simplifyDots.catch(() => undefined);
        await Promise.all([
          animation.finished.catch(() => undefined),
          ...motionBlurAnimations.map(motionBlurAnimation =>
            motionBlurAnimation.finished.catch(() => undefined),
          ),
        ]);
        resetCompressionMotionBlur();
        yinYangSymbol.style.filter = 'blur(1.65px) brightness(1.08)';
        yinYangSymbol.style.transform = `rotate(${targetRotation}deg) scale(0.14)`;
        return targetRotation;
      }

      async function implodeSymbol(startRotation) {
        if (!yinYangSymbol || prefersReducedMotion.matches) {
          return;
        }

        const rotation = Number.isFinite(startRotation) ? startRotation : 0;
        const implodeDuration = 520;
        const targetRotation = rotation + (peakRotationDegreesPerMs * implodeDuration);
        const animation = yinYangSymbol.animate([
          {
            filter: 'blur(1.65px) brightness(1.08)',
            transform: `rotate(${rotation}deg) scale(0.14)`,
          },
          {
            filter: 'blur(2.05px) brightness(1.14)',
            transform: `rotate(${rotation + 430}deg) scale(0.085)`,
            offset: 0.42,
          },
          {
            filter: 'blur(2.35px) brightness(1.2)',
            transform: `rotate(${rotation + 830}deg) scale(0.056)`,
            offset: 0.78,
          },
          {
            filter: 'blur(1.2px) brightness(1.08)',
            transform: `rotate(${targetRotation}deg) scale(${implosionScale})`,
          },
        ], {
          duration: implodeDuration,
          easing: 'linear',
          fill: 'forwards',
        });

        await animation.finished.catch(() => undefined);
        yinYangSymbol.style.filter = 'blur(1.2px) brightness(1.08)';
        yinYangSymbol.style.transform = `rotate(${targetRotation}deg) scale(${implosionScale})`;
        return targetRotation;
      }

      function resetWhiteBlob() {
        if (!whiteBlob) {
          return;
        }

        whiteBlob.getAnimations?.().forEach(animation => animation.cancel());
        whiteBlob.style.left = '50%';
        whiteBlob.style.top = '50%';
        whiteBlob.style.width = '120px';
        whiteBlob.style.height = '120px';
        whiteBlob.style.opacity = '0';
        whiteBlob.style.visibility = 'visible';
        whiteBlob.style.filter = 'none';
        whiteBlob.style.transform = getBlobTransform(0, 0.001);
        setWhiteBlobPath(whiteDropPathStart);
      }

      function getWhiteBlobCoverageBaseSize(blobSize, centerX, centerY) {
        const safeBlobSize = Math.max(blobSize, 1);
        const viewportWidth = Math.max(window.innerWidth, 1);
        const viewportHeight = Math.max(window.innerHeight, 1);
        const viewportDiagonal = Math.hypot(viewportWidth, viewportHeight);
        const farthestViewportCorner = getFarthestViewportDistanceFrom(centerX, centerY);
        const coverageSize = Math.max(
          safeBlobSize,
          viewportDiagonal * 0.58,
          farthestViewportCorner * 1.85,
          window.innerWidth < 700 ? 760 : 980,
        );

        return Math.min(coverageSize, 1800);
      }

      function getWhiteBlobTargetScale(blobSize, centerX, centerY) {
        const safeBlobSize = Math.max(blobSize, 1);
        const conservativeBlobRadius = safeBlobSize * 0.38;
        const farthestViewportCorner = getFarthestViewportDistanceFrom(centerX, centerY);

        return Math.max(
          (farthestViewportCorner / conservativeBlobRadius) * 1.18,
          window.innerWidth < 700 ? 1.28 : 1.36,
        );
      }

      async function runWhiteBlobTransition(startRotation) {
        if (state.hasLoaderCompleted) {
          return;
        }

        if (!loaderContent || !yinYangGate || !yinYangSymbol || !whiteBlob || prefersReducedMotion.matches) {
          await lockFullWhiteCoverage();
          return;
        }

        const rotation = Number.isFinite(startRotation) ? startRotation : 0;
        const gateBounds = yinYangGate.getBoundingClientRect();
        const centerX = gateBounds.left + (gateBounds.width / 2);
        const centerY = gateBounds.top + (gateBounds.height / 2);
        const viewportCenterX = Math.max(window.innerWidth, 1) / 2;
        const viewportCenterY = Math.max(window.innerHeight, 1) / 2;
        const recenterX = viewportCenterX - centerX;
        const recenterY = viewportCenterY - centerY;
        const blobSize = Math.max(gateBounds.width, gateBounds.height, 1);
        const coverageBaseSize = getWhiteBlobCoverageBaseSize(
          blobSize,
          viewportCenterX,
          viewportCenterY,
        );
        const baseScaleRatio = blobSize / coverageBaseSize;
        const toCoverageScale = scale => scale * baseScaleRatio;
        const startScale = toCoverageScale(Math.max(implosionScale * 0.72, 0.026));
        const targetScale = getWhiteBlobTargetScale(
          coverageBaseSize,
          viewportCenterX,
          viewportCenterY,
        );
        const growthDuration = 2860;
        const finalRotation = rotation + 1460;

        resetCompressionMotionBlur();
        resetWhiteBlob();
        loaderContent.classList.remove('is-replacing-parts', 'is-separated');
        loaderContent.classList.add('is-blob-expanding');

        whiteBlob.style.left = `${centerX}px`;
        whiteBlob.style.top = `${centerY}px`;
        whiteBlob.style.width = `${coverageBaseSize}px`;
        whiteBlob.style.height = `${coverageBaseSize}px`;
        whiteBlob.style.opacity = '0';
        whiteBlob.style.filter = 'none';
        whiteBlob.style.transform = getBlobTransform(rotation, startScale);
        setWhiteBlobPath(whiteDropPathStart);

        yinYangSymbol.style.opacity = '1';
        yinYangSymbol.style.filter = 'blur(1.2px) brightness(1.08)';
        yinYangSymbol.style.transform = `rotate(${rotation}deg) scale(${implosionScale})`;

        const symbolTakeover = yinYangSymbol.animate([
          {
            opacity: 1,
            filter: 'blur(1.2px) brightness(1.08)',
            transform: `rotate(${rotation}deg) scale(${implosionScale})`,
          },
          {
            opacity: 1,
            filter: 'blur(2.4px) brightness(1.16)',
            transform: `rotate(${rotation + 360}deg) scale(${implosionScale * 0.98})`,
            offset: 0.58,
          },
          {
            opacity: 0,
            filter: 'blur(2.7px) brightness(1.1)',
            transform: `rotate(${rotation + 650}deg) scale(${implosionScale * 0.9})`,
          },
        ], {
          duration: 320,
          easing: 'linear',
          fill: 'forwards',
        });

        const blobExpansion = whiteBlob.animate([
          {
            opacity: 0,
            transform: getBlobTransform(rotation, startScale),
          },
          {
            opacity: 1,
            transform: getBlobTransform(rotation + 460, toCoverageScale(0.13)),
            offset: 0.08,
          },
          {
            opacity: 1,
            transform: getBlobTransform(rotation + 780, toCoverageScale(0.38)),
            offset: 0.18,
          },
          {
            opacity: 1,
            transform: getBlobTransform(rotation + 1100, targetScale * 0.22, recenterX * 0.28, recenterY * 0.28),
            offset: 0.36,
          },
          {
            opacity: 1,
            transform: getBlobTransform(rotation + 1320, targetScale * 0.56, recenterX * 0.72, recenterY * 0.72),
            offset: 0.62,
          },
          {
            opacity: 1,
            transform: getBlobTransform(finalRotation, targetScale, recenterX, recenterY),
          },
        ], {
          duration: growthDuration,
          easing: 'linear',
          fill: 'forwards',
        });
        const shapeMorph = animateWhiteBlobPathMorph(growthDuration);

        await Promise.all([
          symbolTakeover.finished.catch(() => undefined),
          blobExpansion.finished.catch(() => undefined),
          shapeMorph.catch(() => undefined),
        ]);

        whiteBlob.style.opacity = '1';
        whiteBlob.style.filter = 'none';
        whiteBlob.style.transform = getBlobTransform(finalRotation, targetScale, recenterX, recenterY);
        setWhiteBlobPath(whiteDropPathCover);
        yinYangSymbol.style.opacity = '0';
        yinYangSymbol.style.filter = 'blur(0px)';
        state.hasShapeWhiteCoverage = true;
        await nextFrame();
        await nextFrame();
        await lockFullWhiteCoverage();
        await prepareStripeRevealLayer();
      }

      async function revealHeroWithLiquidWave() {
        if (
          !loaderContent
          || prefersReducedMotion.matches
          || !state.hasFullWhiteCoverage
          || state.hasLoaderCompleted
          || state.hasLiquidRevealStarted
        ) {
          return;
        }

        state.hasLiquidRevealStarted = true;

        if (!state.hasStripeReady) {
          await prepareStripeRevealLayer();
        }

        setLayerOpacityImmediately(fullWhiteCover, 0);
        if (fullWhiteCover) {
          fullWhiteCover.style.visibility = 'hidden';
        }
        if (whiteBlob) {
          whiteBlob.style.opacity = '0';
          whiteBlob.style.visibility = 'hidden';
        }
        await nextFrame();

        const liquidDescent = startLiquidRevealDescent();
        loaderContent.classList.add('is-liquid-revealing');
        await liquidDescent.aligned;
        loaderContent.classList.add('is-liquid-clearing');
        await liquidDescent.finished;
        loaderContent.classList.add('is-liquid-settled');
      }

      async function startLoaderExit() {
        if (
          !loaderContent
          || state.isLoaderExiting
          || !state.showLoader
          || state.hasLoaderCompleted
        ) {
          return;
        }

        state.isLoaderExiting = true;

        if (prefersReducedMotion.matches) {
          loaderContent.classList.add('is-exiting');
          document.body.classList.add('portfolio-reduced-motion-reveal');
          revealHeroContent();
          loaderContent.classList.add('is-fading');
          await delay(120);
        } else {
          const handoffRotation = await prepareSpinExitHandoff();
          loaderContent.classList.add('is-exiting');
          const compressedRotation = await accelerateAndCompressSymbol(handoffRotation);
          const implodedRotation = await implodeSymbol(compressedRotation);
          await runWhiteBlobTransition(implodedRotation);
          revealHeroContent();
          await delay(180);
          await revealHeroWithLiquidWave();
          await delay(360);
          loaderContent.classList.add('is-fading');
          await delay(640);
        }

        completeLoader();
      }

      async function waitForReadyAndExit() {
        await Promise.all([
          minLoaderDuration,
          windowLoaded,
          fontsReady,
          loaderAssetsReady,
          appReady,
        ]);
        await startLoaderExit();
      }

      return {
        appRoot,
        state,
        waitForReadyAndExit,
      };
    }

    window.portfolioLoader = null;
    window.portfolioLoaderParticleBackground = null;

    window.addEventListener('DOMContentLoaded', function() {
      window.portfolioLoaderParticleBackground = createLoaderParticleBackground();
    });

    window.addEventListener('load', function(ev) {
      window.portfolioLoader = createPortfolioLoader();
      window.portfolioLoader.waitForReadyAndExit();

      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            hostElement: window.portfolioLoader.appRoot,
          }).then(async function(appRunner) {
            await appRunner.runApp();
          });
        }
      });
    });
  </script>

    window.flutterWebRenderer = "html";
