  <script type="text/javascript">
    window.portfolioRenderPdfPages = async function(container, sourceUrl, zoom, maxPages, compact, animateTransition) {
      if (!container || !window.pdfjsLib || !sourceUrl) {
        return;
      }

      const renderToken = `${Date.now()}-${Math.random()}`;
      const pageLimit = Math.max(1, Math.min(maxPages || 2, 2));
      const zoomMultiplier = Math.max(0.65, Math.min(1.6, (zoom || 100) / 100));
      const pixelRatio = window.devicePixelRatio || 1;
      const containerPadding = compact ? 12 : 18;

      container.dataset.renderToken = renderToken;
      container.style.transition = animateTransition ? "opacity 360ms ease" : "none";
      if (animateTransition) {
        container.style.opacity = "0.16";
        await new Promise(resolve => setTimeout(resolve, 260));
        if (container.dataset.renderToken !== renderToken) return;
      }

      container.innerHTML = "";
      container.style.width = "100%";
      container.style.height = "100%";
      container.style.overflow = "auto";
      container.style.backgroundColor = "#ffffff";
      container.style.boxSizing = "border-box";
      container.style.padding = `${containerPadding}px`;
      container.style.display = "flex";
      container.style.flexDirection = "column";
      container.style.alignItems = compact && zoomMultiplier > 1 ? "flex-start" : "center";
      container.style.gap = compact ? "14px" : "18px";
      container.style.opacity = animateTransition ? "0.16" : "1";

      const loader = document.createElement("div");
      loader.textContent = "Loading CV...";
      loader.style.color = "#111111";
      loader.style.fontFamily = "Poppins, sans-serif";
      loader.style.fontWeight = "700";
      loader.style.padding = "32px";
      container.appendChild(loader);

      const isCurrentRender = () => container.dataset.renderToken === renderToken;

      try {
        const pdfDocument = await pdfjsLib.getDocument(sourceUrl).promise;
        if (!isCurrentRender()) return;

        container.removeChild(loader);

        const pagesToRender = Math.min(pdfDocument.numPages, pageLimit);
        for (let pageNumber = 1; pageNumber <= pagesToRender; pageNumber++) {
          const page = await pdfDocument.getPage(pageNumber);
          if (!isCurrentRender()) return;

          const baseViewport = page.getViewport({ scale: 1 });
          const availableWidth = Math.max(240, container.clientWidth - (containerPadding * 2));
          const fitScale = compact ? availableWidth / baseViewport.width : 1;
          const viewport = page.getViewport({ scale: fitScale * zoomMultiplier });
          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");

          canvas.width = Math.floor(viewport.width * pixelRatio);
          canvas.height = Math.floor(viewport.height * pixelRatio);
          canvas.style.width = `${viewport.width}px`;
          canvas.style.height = `${viewport.height}px`;
          canvas.style.maxWidth = "none";
          canvas.style.flex = "0 0 auto";
          canvas.style.backgroundColor = "#ffffff";
          canvas.style.boxShadow = "0 10px 22px rgba(0, 0, 0, 0.12)";

          context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, viewport.width, viewport.height);

          await page.render({ canvasContext: context, viewport }).promise;
          if (!isCurrentRender()) return;

          container.appendChild(canvas);
        }

        requestAnimationFrame(() => {
          if (isCurrentRender()) {
            container.style.opacity = "1";
          }
        });
      } catch (error) {
        if (!isCurrentRender()) return;

        container.innerHTML = "";
        const message = document.createElement("div");
        message.textContent = "Unable to load the CV.";
        message.style.color = "#111111";
        message.style.fontFamily = "Poppins, sans-serif";
        message.style.fontWeight = "700";
        message.style.padding = "32px";
        container.appendChild(message);
        container.style.opacity = "1";
      }
    };
  </script>

  <script>
    function delay(time) {
      return new Promise(resolve => setTimeout(resolve, time));
    }

    function nextFrame() {
      return new Promise(resolve => requestAnimationFrame(() => resolve()));
    }

    function createPortfolioLoader() {
      const loaderContent = document.querySelector('#loader-content');
      const appRoot = document.querySelector('#portfolio-app-root');
      const yinYangGate = loaderContent?.querySelector('.yin-yang-gate');
      const yinYangSymbol = loaderContent?.querySelector('.yin-yang-symbol');
      const blackPart = loaderContent?.querySelector('.yin-yang-part-black');
      const whitePart = loaderContent?.querySelector('.yin-yang-part-white');
      const state = {
        isAppReady: false,
        isLoaderExiting: false,
        showLoader: Boolean(loaderContent),
        hasHeroEntered: false,
      };
      const loaderAssetUrls = [
        'assets/assets/loader-yingyang/yingyang.png',
        'assets/assets/loader-yingyang/yingyangwithoutdots.png',
        'assets/assets/loader-yingyang/black.png',
        'assets/assets/loader-yingyang/white.png',
      ];
      const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const minLoaderDuration = delay(940);
      const windowLoaded = document.readyState === 'complete'
        ? Promise.resolve()
        : new Promise(resolve => window.addEventListener('load', resolve, { once: true }));
      const fontsReady = document.fonts?.ready
        ? document.fonts.ready.catch(() => undefined)
        : Promise.resolve();
      const appReady = new Promise(resolve => {
        window.addEventListener('portfolio-app-ready', function handleAppReady() {
          state.isAppReady = true;
          resolve();
        }, { once: true });
      });
      const loaderAssetsReady = Promise.all(loaderAssetUrls.map(waitForImageAsset));

      function waitForImageAsset(url) {
        return new Promise(resolve => {
          const image = new Image();
          let settled = false;
          const finish = () => {
            if (settled) {
              return;
            }
            settled = true;
            if (image.decode) {
              image.decode().catch(() => undefined).then(resolve);
            } else {
              resolve();
            }
          };

          image.decoding = 'async';
          image.onload = finish;
          image.onerror = finish;
          image.src = url;

          if (image.complete) {
            finish();
          }
        });
      }

      function revealHeroContent() {
        if (state.hasHeroEntered) {
          return;
        }

        appRoot?.removeAttribute('aria-hidden');
        document.body.classList.add('portfolio-reveal-active');
        state.hasHeroEntered = true;
      }

      function getCurrentRotationDegrees(element) {
        const transform = window.getComputedStyle(element).transform;
        if (!transform || transform === 'none') {
          return 0;
        }

        const matrix = new DOMMatrixReadOnly(transform);
        return Math.atan2(matrix.b, matrix.a) * (180 / Math.PI);
      }

      function parseCssTimeToMs(value, fallback) {
        const cssTime = String(value || '').trim();
        const numericValue = Number.parseFloat(cssTime);
        if (!Number.isFinite(numericValue)) {
          return fallback;
        }

        return cssTime.endsWith('ms') ? numericValue : numericValue * 1000;
      }

      function getLoadingSpinDuration() {
        if (!yinYangSymbol) {
          return 1120;
        }

        const duration = window
          .getComputedStyle(yinYangSymbol)
          .getPropertyValue('--loader-spin-duration');
        return parseCssTimeToMs(duration, 1120);
      }

      function getLoadingSpinAnimation() {
        if (!yinYangSymbol?.getAnimations) {
          return null;
        }

        return yinYangSymbol
          .getAnimations()
          .find(animation => animation.animationName === 'loader-spin') || null;
      }

      async function waitForSpinHandoffPoint() {
        if (!yinYangSymbol || prefersReducedMotion.matches) {
          return;
        }

        const spinAnimation = getLoadingSpinAnimation();
        const spinDuration = getLoadingSpinDuration();
        const currentTime = Number(spinAnimation?.currentTime);
        if (!spinAnimation || !Number.isFinite(currentTime) || spinDuration <= 0) {
          await nextFrame();
          return;
        }

        const cycleProgress = ((currentTime % spinDuration) + spinDuration) % spinDuration;
        let timeUntilBoundary = spinDuration - cycleProgress;
        if (timeUntilBoundary < 90) {
          timeUntilBoundary += spinDuration;
        }

        await delay(timeUntilBoundary);
        await nextFrame();
      }

      async function prepareSpinExitHandoff() {
        await waitForSpinHandoffPoint();

        if (!yinYangSymbol) {
          return 0;
        }

        const currentRotation = getCurrentRotationDegrees(yinYangSymbol);
        yinYangSymbol.style.transform = `rotate(${currentRotation}deg) scale(1)`;
        yinYangSymbol.style.animation = 'none';
        return currentRotation;
      }

      function getLiquidRevealDuration() {
        return prefersReducedMotion.matches ? 1 : 1840;
      }

      async function accelerateAndCompressSymbol(handoffRotation) {
        if (!loaderContent || !yinYangSymbol || prefersReducedMotion.matches) {
          return;
        }

        const currentRotation = Number.isFinite(handoffRotation)
          ? handoffRotation
          : getCurrentRotationDegrees(yinYangSymbol);
        const targetRotation = currentRotation + 1980;
        yinYangSymbol.style.transform = `rotate(${currentRotation}deg) scale(1)`;
        yinYangSymbol.style.animation = 'none';

        const simplifyDots = delay(840).then(() => {
          loaderContent.classList.add('is-simplifying');
        });
        const animation = yinYangSymbol.animate([
          {
            filter: 'blur(0px) brightness(1)',
            transform: `rotate(${currentRotation}deg) scale(1)`,
          },
          {
            filter: 'blur(0.25px) brightness(1.02)',
            transform: `rotate(${currentRotation + 540}deg) scale(0.7)`,
            offset: 0.28,
          },
          {
            filter: 'blur(1.05px) brightness(1.06)',
            transform: `rotate(${currentRotation + 1320}deg) scale(0.32)`,
            offset: 0.72,
          },
          {
            filter: 'blur(1.65px) brightness(1.08)',
            transform: `rotate(${targetRotation}deg) scale(0.14)`,
          },
        ], {
          duration: 1560,
          easing: 'cubic-bezier(0.34, 0.1, 0.84, 0.32)',
          fill: 'forwards',
        });

        simplifyDots.catch(() => undefined);
        await animation.finished.catch(() => undefined);
        yinYangSymbol.style.filter = 'blur(1.65px) brightness(1.08)';
        yinYangSymbol.style.transform = `rotate(${targetRotation}deg) scale(0.14)`;
        return targetRotation;
      }

      async function implodeSymbol(startRotation) {
        if (!yinYangSymbol || prefersReducedMotion.matches) {
          return;
        }

        const rotation = Number.isFinite(startRotation) ? startRotation : 0;
        const targetRotation = rotation + 360;
        const animation = yinYangSymbol.animate([
          {
            filter: 'blur(1.65px) brightness(1.08)',
            transform: `rotate(${rotation}deg) scale(0.14)`,
          },
          {
            filter: 'blur(2.35px) brightness(1.2)',
            transform: `rotate(${rotation + 280}deg) scale(0.038)`,
            offset: 0.68,
          },
          {
            filter: 'blur(0px) brightness(1)',
            transform: `rotate(${targetRotation}deg) scale(0.11)`,
          },
        ], {
          duration: 580,
          easing: 'cubic-bezier(0.86, 0, 0.16, 1)',
          fill: 'forwards',
        });

        await animation.finished.catch(() => undefined);
        yinYangSymbol.style.filter = 'blur(0px)';
        yinYangSymbol.style.transform = `rotate(${targetRotation}deg) scale(0.11)`;
        return targetRotation;
      }

      async function splitSymbolIntoParts(finalRotation) {
        if (!loaderContent || !yinYangSymbol || !blackPart || !whitePart || prefersReducedMotion.matches) {
          return;
        }

        const rotation = Number.isFinite(finalRotation) ? finalRotation : 0;
        yinYangSymbol.style.transform = `rotate(${rotation}deg) scale(0.11)`;
        blackPart.style.transform = 'translate3d(0, 0, 0) rotate(0deg) scale(1)';
        whitePart.style.transform = 'translate3d(0, 0, 0) rotate(0deg) scale(1)';
        loaderContent.classList.add('is-separated');
        await nextFrame();
        return rotation;
      }

      async function expandSplitPartsToWhiteCover(finalRotation) {
        if (!loaderContent || !yinYangGate || !yinYangSymbol || !blackPart || !whitePart || prefersReducedMotion.matches) {
          return;
        }

        const gateBounds = yinYangGate.getBoundingClientRect();
        const partWidth = Math.max(gateBounds.width, 1);
        const viewportMax = Math.max(window.innerWidth, window.innerHeight);
        const whiteCoverScale = Math.max((viewportMax / partWidth) * 3.8, window.innerWidth < 700 ? 28 : 34);
        const blackScale = Math.max((viewportMax / partWidth) * 1.9, window.innerWidth < 700 ? 11.5 : 15);
        const spreadX = Math.min(Math.max(window.innerWidth * 0.42, 140), window.innerWidth < 700 ? 250 : 560);
        const spreadY = Math.min(Math.max(window.innerHeight * 0.11, 38), window.innerWidth < 700 ? 105 : 150);
        const rotation = Number.isFinite(finalRotation) ? finalRotation : 0;
        yinYangSymbol.style.transform = `rotate(${rotation}deg) scale(0.11)`;

        const symbolSpin = yinYangSymbol.animate([
          {
            transform: `rotate(${rotation}deg) scale(0.11)`,
          },
          {
            transform: `rotate(${rotation + 270}deg) scale(0.36)`,
            offset: 0.24,
          },
          {
            transform: `rotate(${rotation + 560}deg) scale(0.68)`,
            offset: 0.56,
          },
          {
            transform: `rotate(${rotation + 940}deg) scale(1.02)`,
          },
        ], {
          duration: 3020,
          easing: 'cubic-bezier(0.34, 0, 0.2, 1)',
          fill: 'forwards',
        });

        const switchToWhiteCover = delay(2540).then(async () => {
          loaderContent.classList.add('is-white-covering');
          await delay(260);
          symbolSpin.cancel();
          blackAnimation.cancel();
          whiteAnimation.cancel();
          yinYangSymbol.style.opacity = '0';
        });

        const blackAnimation = blackPart.animate([
          {
            opacity: 1,
            transform: 'translate3d(0, 0, 0) rotate(0deg) scale(1)',
          },
          {
            opacity: 1,
            transform: `translate3d(${-spreadX}px, ${-spreadY * 0.55}px, 0) rotate(-135deg) scale(${blackScale * 0.12})`,
            offset: 0.24,
          },
          {
            opacity: 0.98,
            transform: `translate3d(${-spreadX * 1.08}px, ${spreadY * 1.2}px, 0) rotate(-405deg) scale(${blackScale * 0.26})`,
            offset: 0.48,
          },
          {
            opacity: 0.52,
            transform: `translate3d(${-spreadX * 0.9}px, ${spreadY * 2.1}px, 0) rotate(-665deg) scale(${blackScale * 0.42})`,
            offset: 0.68
          },
          {
            opacity: 0.02,
            transform: `translate3d(${-spreadX * 0.42}px, ${spreadY * 1.1}px, 0) rotate(-800deg) scale(${blackScale * 0.68})`,
            offset: 0.82
          },
          {
            opacity: 0,
            transform: `translate3d(${-spreadX * 0.2}px, ${spreadY * 0.65}px, 0) rotate(-920deg) scale(${blackScale})`,
          },
        ], {
          duration: 2460,
          easing: 'cubic-bezier(0.56, 0, 0.18, 1)',
          fill: 'forwards',
        });

        const whiteAnimation = whitePart.animate([
          {
            opacity: 1,
            transform: 'translate3d(0, 0, 0) rotate(0deg) scale(1)',
          },
          {
            opacity: 1,
            transform: `translate3d(${spreadX}px, ${spreadY * 0.65}px, 0) rotate(135deg) scale(${whiteCoverScale * 0.058})`,
            offset: 0.23,
          },
          {
            opacity: 1,
            transform: `translate3d(${spreadX * 1.25}px, ${-spreadY * 0.7}px, 0) rotate(405deg) scale(${whiteCoverScale * 0.115})`,
            offset: 0.46,
          },
          {
            opacity: 1,
            transform: `translate3d(${spreadX * 1.32}px, ${-spreadY * 1.35}px, 0) rotate(665deg) scale(${whiteCoverScale * 0.17})`,
            offset: 0.68,
          },
          {
            opacity: 1,
            transform: `translate3d(${spreadX * 0.96}px, ${-spreadY * 0.95}px, 0) rotate(790deg) scale(${whiteCoverScale * 0.3})`,
            offset: 0.8,
          },
          {
            opacity: 1,
            transform: `translate3d(${spreadX * 0.36}px, ${-spreadY * 0.28}px, 0) rotate(875deg) scale(${whiteCoverScale * 0.58})`,
            offset: 0.88,
          },
          {
            opacity: 1,
            transform: `translate3d(0, 0, 0) rotate(960deg) scale(${whiteCoverScale})`,
          },
        ], {
          duration: 3020,
          easing: 'cubic-bezier(0.55, 0, 0.13, 1)',
          fill: 'forwards',
        });

        await Promise.all([
          blackAnimation.finished.catch(() => undefined),
          whiteAnimation.finished.catch(() => undefined),
          symbolSpin.finished.catch(() => undefined),
          switchToWhiteCover,
        ]);
      }

      async function revealHeroWithLiquidWave() {
        if (!loaderContent || prefersReducedMotion.matches) {
          return;
        }

        loaderContent.classList.add('is-liquid-revealing');
        await delay(getLiquidRevealDuration());
        loaderContent.classList.add('is-liquid-settled');
      }

      async function startLoaderExit() {
        if (!loaderContent || state.isLoaderExiting || !state.showLoader) {
          return;
        }

        state.isLoaderExiting = true;

        if (prefersReducedMotion.matches) {
          loaderContent.classList.add('is-exiting');
          document.body.classList.add('portfolio-reduced-motion-reveal');
          revealHeroContent();
          loaderContent.classList.add('is-fading');
          await delay(120);
        } else {
          const handoffRotation = await prepareSpinExitHandoff();
          loaderContent.classList.add('is-exiting');
          const compressedRotation = await accelerateAndCompressSymbol(handoffRotation);
          const implodedRotation = await implodeSymbol(compressedRotation);
          const finalRotation = await splitSymbolIntoParts(implodedRotation);
          await expandSplitPartsToWhiteCover(finalRotation);
          revealHeroContent();
          await delay(180);
          await revealHeroWithLiquidWave();
          await delay(360);
          loaderContent.classList.add('is-fading');
          await delay(640);
        }

        loaderContent.classList.add('is-hidden');
        loaderContent.setAttribute('aria-hidden', 'true');
        loaderContent.remove();
        state.showLoader = false;
      }

      async function waitForReadyAndExit() {
        await Promise.all([
          minLoaderDuration,
          windowLoaded,
          fontsReady,
          loaderAssetsReady,
          appReady,
        ]);
        await startLoaderExit();
      }

      return {
        appRoot,
        state,
        waitForReadyAndExit,
      };
    }

    window.portfolioLoader = null;

    window.addEventListener('load', function(ev) {
      window.portfolioLoader = createPortfolioLoader();
      window.portfolioLoader.waitForReadyAndExit();

      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            hostElement: window.portfolioLoader.appRoot,
          }).then(async function(appRunner) {
            await appRunner.runApp();
          });
        }
      });
    });
  </script>
